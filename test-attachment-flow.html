<!DOCTYPE html>
<html>
<head>
    <title>Complete Attachment Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; margin: 20px; 
            background: #f5f5f5;
        }
        .container { 
            max-width: 800px; margin: 0 auto; 
            background: white; padding: 20px; border-radius: 8px;
        }
        .step { 
            margin: 20px 0; padding: 15px; 
            border: 1px solid #ddd; border-radius: 5px;
        }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        input, button { 
            margin: 5px; padding: 8px; 
            border: 1px solid #ddd; border-radius: 4px;
        }
        button { 
            background: #007bff; color: white; 
            cursor: pointer; border: none;
        }
        button:hover { background: #0056b3; }
        .result { 
            margin-top: 10px; padding: 10px; 
            background: #f8f9fa; border-radius: 4px;
        }
        img { max-width: 200px; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Complete File Attachment Test</h1>
        
        <!-- Step 1: Authentication -->
        <div class="step" id="authStep">
            <h3>Step 1: Authentication</h3>
            <input type="text" id="username" placeholder="Username" value="mickey_mouse">
            <input type="password" id="password" placeholder="Password" value="password123">
            <button onclick="login()">Login</button>
            <div class="result" id="authResult">Not authenticated</div>
        </div>
        
        <!-- Step 2: File Upload -->
        <div class="step" id="uploadStep">
            <h3>Step 2: File Upload</h3>
            <input type="file" id="fileInput" accept="image/*,application/pdf,.doc,.docx,.txt">
            <button onclick="uploadFile()">Upload File</button>
            <div class="result" id="uploadResult">No file uploaded</div>
        </div>
        
        <!-- Step 3: Send Message with Attachment -->
        <div class="step" id="messageStep">
            <h3>Step 3: Send Message with Attachment</h3>
            <input type="text" id="messageText" placeholder="Message content" value="Test message with attachment">
            <button onclick="sendMessage()">Send Message</button>
            <div class="result" id="messageResult">No message sent</div>
        </div>
        
        <!-- Step 4: View Messages -->
        <div class="step" id="viewStep">
            <h3>Step 4: View Messages</h3>
            <button onclick="viewMessages()">Refresh Messages</button>
            <div class="result" id="messagesResult">No messages loaded</div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let uploadedAttachment = null;
        let conversationId = null;

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password })
                });
                
                if (response.ok) {
                    // Get user info
                    const userResponse = await fetch('/api/auth/user', {
                        credentials: 'include'
                    });
                    
                    if (userResponse.ok) {
                        currentUser = await userResponse.json();
                        document.getElementById('authResult').innerHTML = `
                            <div style="color: green;">✓ Authenticated as ${currentUser.username}</div>
                        `;
                        document.getElementById('authStep').classList.add('success');
                    }
                } else {
                    document.getElementById('authResult').innerHTML = `
                        <div style="color: red;">✗ Authentication failed</div>
                    `;
                    document.getElementById('authStep').classList.add('error');
                }
            } catch (error) {
                document.getElementById('authResult').innerHTML = `
                    <div style="color: red;">✗ Error: ${error.message}</div>
                `;
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                document.getElementById('uploadResult').innerHTML = 'No file selected';
                return;
            }
            
            if (!currentUser) {
                document.getElementById('uploadResult').innerHTML = 'Please login first';
                return;
            }
            
            try {
                // Get upload URL
                const response = await fetch('/api/attachments/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        fileName: file.name,
                        contentType: file.type,
                        size: file.size
                    })
                });
                
                if (!response.ok) {
                    const error = await response.text();
                    document.getElementById('uploadResult').innerHTML = `
                        <div style="color: red;">✗ Upload failed: ${error}</div>
                    `;
                    return;
                }
                
                const { uploadURL } = await response.json();
                
                // Upload file to storage
                const uploadResponse = await fetch(uploadURL, {
                    method: 'PUT',
                    body: file,
                    headers: { 'Content-Type': file.type }
                });
                
                if (uploadResponse.ok) {
                    uploadedAttachment = {
                        id: `file-${Date.now()}`,
                        name: file.name,
                        size: file.size,
                        type: file.type,
                        url: uploadURL.split('?')[0],
                        uploadedAt: new Date()
                    };
                    
                    document.getElementById('uploadResult').innerHTML = `
                        <div style="color: green;">✓ File uploaded successfully</div>
                        <div>Name: ${file.name}</div>
                        <div>Size: ${file.size} bytes</div>
                        <div>Type: ${file.type}</div>
                    `;
                    document.getElementById('uploadStep').classList.add('success');
                } else {
                    document.getElementById('uploadResult').innerHTML = `
                        <div style="color: red;">✗ Storage upload failed</div>
                    `;
                }
            } catch (error) {
                document.getElementById('uploadResult').innerHTML = `
                    <div style="color: red;">✗ Error: ${error.message}</div>
                `;
            }
        }

        async function sendMessage() {
            if (!currentUser) {
                document.getElementById('messageResult').innerHTML = 'Please login first';
                return;
            }
            
            const messageText = document.getElementById('messageText').value;
            if (!messageText && !uploadedAttachment) {
                document.getElementById('messageResult').innerHTML = 'No message content or attachment';
                return;
            }
            
            try {
                // Get conversations first
                const convsResponse = await fetch('/api/conversations', {
                    credentials: 'include'
                });
                
                if (convsResponse.ok) {
                    const conversations = await convsResponse.json();
                    if (conversations.length > 0) {
                        conversationId = conversations[0].id;
                    }
                }
                
                if (!conversationId) {
                    document.getElementById('messageResult').innerHTML = 'No conversation found';
                    return;
                }
                
                // Send message with attachment
                const messageData = {
                    content: messageText,
                    attachments: uploadedAttachment ? [uploadedAttachment] : []
                };
                
                const response = await fetch(`/api/conversations/${conversationId}/messages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(messageData)
                });
                
                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('messageResult').innerHTML = `
                        <div style="color: green;">✓ Message sent successfully</div>
                        <div>Message ID: ${result.id}</div>
                        <div>Attachments: ${result.attachments ? result.attachments.length : 0}</div>
                    `;
                    document.getElementById('messageStep').classList.add('success');
                } else {
                    const error = await response.text();
                    document.getElementById('messageResult').innerHTML = `
                        <div style="color: red;">✗ Message send failed: ${error}</div>
                    `;
                }
            } catch (error) {
                document.getElementById('messageResult').innerHTML = `
                    <div style="color: red;">✗ Error: ${error.message}</div>
                `;
            }
        }

        async function viewMessages() {
            if (!conversationId) {
                document.getElementById('messagesResult').innerHTML = 'No conversation selected';
                return;
            }
            
            try {
                const response = await fetch(`/api/conversations/${conversationId}/messages`, {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const messages = await response.json();
                    let html = `<div style="color: green;">✓ Found ${messages.length} messages</div>`;
                    
                    // Show last 3 messages with attachments
                    const recentMessages = messages.slice(-3);
                    recentMessages.forEach(msg => {
                        html += `
                            <div style="border: 1px solid #eee; margin: 5px 0; padding: 8px;">
                                <strong>${msg.sender?.username || 'Unknown'}:</strong> ${msg.content}
                                <br><small>Attachments: ${msg.attachments ? msg.attachments.length : 0}</small>
                                ${msg.attachments && msg.attachments.length > 0 ? 
                                    msg.attachments.map(att => `
                                        <div style="margin: 5px 0;">
                                            📎 ${att.name} (${att.size} bytes)
                                        </div>
                                    `).join('') : ''
                                }
                            </div>
                        `;
                    });
                    
                    document.getElementById('messagesResult').innerHTML = html;
                    document.getElementById('viewStep').classList.add('success');
                } else {
                    document.getElementById('messagesResult').innerHTML = `
                        <div style="color: red;">✗ Failed to load messages</div>
                    `;
                }
            } catch (error) {
                document.getElementById('messagesResult').innerHTML = `
                    <div style="color: red;">✗ Error: ${error.message}</div>
                `;
            }
        }

        // Auto-login on page load
        window.onload = function() {
            login();
        };
    </script>
</body>
</html>
