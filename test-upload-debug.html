<!DOCTYPE html>
<html>
<head>
    <title>Upload Debug Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 4px; }
        button { margin: 5px; padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>File Upload Debug Test</h1>
    
    <button onclick="testAuth()">1. Test Auth</button>
    <button onclick="testUploadURL()">2. Test Upload URL</button>
    <button onclick="testWithAuth()">3. Test Upload with Auth</button>
    
    <div id="results"></div>

    <script>
        function log(message, data = null) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result';
            div.innerHTML = `<strong>${message}</strong><br><pre>${data ? JSON.stringify(data, null, 2) : ''}</pre>`;
            results.appendChild(div);
            console.log(message, data);
        }

        async function testAuth() {
            try {
                const response = await fetch('/api/auth/user', {
                    credentials: 'include'
                });
                const data = await response.json();
                log('Auth Status:', { status: response.status, data });
            } catch (error) {
                log('Auth Error:', error.message);
            }
        }

        async function testUploadURL() {
            try {
                const response = await fetch('/api/attachments/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        fileName: 'test.png',
                        contentType: 'image/png',
                        size: 1000
                    })
                });
                const data = await response.text();
                log('Upload URL Response:', { status: response.status, data });
            } catch (error) {
                log('Upload URL Error:', error.message);
            }
        }

        async function testWithAuth() {
            // First login if needed
            await testAuth();
            // Then try upload
            await testUploadURL();
        }
    </script>
</body>
</html>
